<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#0d1117">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="nav"><a class="brand" href="{{ '/' | relative_url }}"><span class="mark">M</span> ManimCE <b>Claude</b></a><nav aria-label="Main navigation"><a href="{{ '/docs/' | relative_url }}">Documentation</a><a href="https://github.com/{{ site.repository }}">GitHub</a></nav></header>
  <main id="main">{{ content }}</main>
  <footer><span>Built for the Manim Community.</span><span><a href="{{ '/docs/' | relative_url }}">Docs</a> · <a href="https://github.com/{{ site.repository }}/blob/main/LICENSE">MIT License</a></span></footer>
</body>
</html>
