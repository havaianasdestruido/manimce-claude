name: Deploy Jekyll site and Docusaurus docs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install documentation dependencies
        working-directory: docs-site
        run: npm ci
      - name: Build Docusaurus documentation
        working-directory: docs-site
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build primary site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Mount Docusaurus at /docs
        run: |
          rm -rf _site/docs
          mkdir -p _site/docs
          cp -R docs-site/build/. _site/docs/
      - name: Upload combined site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
